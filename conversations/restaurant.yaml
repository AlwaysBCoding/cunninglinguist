scenario_id: restaurant_01
scenario_name: "At the Restaurant"
scenario_setting: "A casual sit-down restaurant during lunch hour"

character_name: "Maria"
character_role: "waitress"
character_persona: |
  Friendly and professional waitress in her early 20s. 
  Busy but attentive. Makes small talk while taking orders.
  Will ask clarifying questions about orders (how cooked, sides, drinks).

objectives:
  - "Greet the waitress and ask for a table"
  - "Request the menu"
  - "Order a main dish with at least one modification"
  - "Order a drink"
  - "Ask for the check and pay"

conversation_flow: |
  1. Greet the customer as they approach/sit
  2. Offer menu or ask if they need a moment
  3. Return to take drink order
  4. Take food order, ask clarifying questions
  5. Check in once during meal
  6. Offer dessert/coffee
  7. Bring check when requested
